<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Lorem Ipsum</title>
<link rel="stylesheet" href="https://cdn.cssvars.com/cssvars.css">
</head>
<body class="bg-black" style="background-image:url('https://picsum.photos/seed/cssvars-dark-login/1920/1080'); background-size:cover; background-position:center;">
<div class="position-relative d-flex flex-column align-items-center justify-content-center" style="min-height:100vh; background:linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.8));">

  <div style="max-width:24rem; width:100%; padding:0 1rem;">

    <div class="center m-b-4">
      <span class="icon-box circle" style="width:3rem;height:3rem;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.1); border:0.0625rem solid rgba(255,255,255,0.25);">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="icon-s icon-white-fill"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5l-8-3zm0 2.2 6 2.25V11c0 4-2.6 7-6 8.9-3.4-1.9-6-4.9-6-8.9V6.45l6-2.25z"/><path d="m10.9 13.6-1.8-1.8-1.3 1.3L10.9 16.2 16.2 10.9l-1.3-1.3z"/></svg>
      </span>
      <h1 class="white h3 m-t-2 m-b-1">Lorem Ipsum</h1>
      <p class="small" style="color:rgba(255,255,255,0.65);">Secure access to your workspace</p>
    </div>

    <div class="card" style="background:rgba(20,20,20,0.7); border:0.0625rem solid rgba(255,255,255,0.12); backdrop-filter:blur(0.5rem);">
      <form>
        <div class="form-group">
          <label class="small m-b--1-4" style="display:block; color:rgba(255,255,255,0.7);">Email</label>
          <input type="email" class="form-control" placeholder="you@loremipsum.com" style="background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.2); color:#fff;">
        </div>
        <div class="form-group">
          <label class="small m-b--1-4" style="display:block; color:rgba(255,255,255,0.7);">Password</label>
          <input type="password" class="form-control" placeholder="Enter your password" style="background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.2); color:#fff;">
        </div>

        <div class="d-flex justify-content-between align-items-center m-b-3">
          <div class="d-flex align-items-center gap-2">
            <input type="checkbox" class="styled-checkbox" id="darkRemember">
            <label for="darkRemember" class="small" style="color:rgba(255,255,255,0.65);">Remember me</label>
          </div>
          <a href="#" class="small" style="color:#fff;">Forgot password?</a>
        </div>

        <button type="submit" class="button button-w-100 bg-white" style="color:#111;">
          Sign in securely
        </button>
      </form>

      <div class="centered-row gap-2 m-t-3 m-b-3">
        <hr class="width-50" style="flex:1; border-color:rgba(255,255,255,0.2);">
        <span class="small" style="color:rgba(255,255,255,0.5);">or</span>
        <hr class="width-50" style="flex:1; border-color:rgba(255,255,255,0.2);">
      </div>

      <div class="row gap-2" style="margin:0;">
        <a href="#" class="col button d-flex align-items-center justify-content-center gap-2" style="text-decoration:none; background:rgba(255,255,255,0.08); border:0.0625rem solid rgba(255,255,255,0.2); color:#fff;">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="icon-xs">
<path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/>
<path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.3 21.3 7.3 24 12 24z"/>
<path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.6.4-2.4V6.5H1.4A12 12 0 0 0 0 12c0 1.9.5 3.8 1.4 5.5z"/>
<path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4C17.9 1.2 15.1 0 12 0 7.3 0 3.3 2.7 1.4 6.5l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/>
</svg><span class="small">Google</span>
        </a>
        <a href="#" class="col button d-flex align-items-center justify-content-center gap-2" style="text-decoration:none; background:rgba(255,255,255,0.08); border:0.0625rem solid rgba(255,255,255,0.2); color:#fff;">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="icon-xs icon-black-fill">
<path d="M12 .5C5.7.5.8 5.4.8 11.7c0 5 3.2 9.2 7.7 10.7.6.1.8-.3.8-.6v-2.2c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.5 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 1.1a10.3 10.3 0 0 1 5.4 0c2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.2-2.6 5.2-5.1 5.5.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.5-1.5 7.7-5.7 7.7-10.7C23.2 5.4 18.3.5 12 .5z"/>
</svg><span class="small">GitHub</span>
        </a>
      </div>
    </div>

    <p class="center small m-t-3" style="color:rgba(255,255,255,0.6);">
      Don't have an account? <a href="#" style="color:#fff; font-weight:600;">Sign up</a>
    </p>

  </div>

</div>
</body>
</html>
