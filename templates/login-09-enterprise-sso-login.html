<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Sign In — Lorem Ipsum</title>
<link rel="stylesheet" href="https://cdn.cssvars.com/cssvars.css">
</head>
<body class="bg-light-grey">
<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height:100vh; padding-top:3rem; padding-bottom:3rem;">

  <div style="max-width:26rem; width:100%;">

    <div class="center m-b-4">
      <span class="icon-box bg-color-1 circle icon-white-fill" style="width:3rem;height:3rem;display:inline-flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="icon-s icon-white-fill"><path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v6h5a1 1 0 0 1 1 1v10h-8v-4h-2v4H4zm2-2h2v-2H6v2zm0-4h2v-2H6v2zm0-4h2V9H6v2zm4 8h2v-2h-2v2zm0-4h2v-2h-2v2zm0-4h2V9h-2v2zm7 8h2v-2h-2v2zm0-4h2v-2h-2v2z"/></svg>
      </span>
      <h1 class="h3 m-t-2 m-b-1">Sign in to your organization</h1>
      <p class="grey small">Lorem ipsum dolor sit amet consectetur adipiscing elit.</p>
    </div>

    <div class="card shadow-2">

      <div class="form-group">
        <label class="small grey m-b--1-4" style="display:block;">Company workspace</label>
        <div class="d-flex align-items-center" style="border:var(--input-border); border-radius:var(--input-radius); overflow:hidden;">
          <input type="text" placeholder="consectetur" style="border:none; box-shadow:none; flex:1; padding:var(--input-padding-y) var(--input-padding-x); background:transparent;">
          <span class="grey small p-h-2" style="border-left:0.0625rem solid var(--light-grey);">.loremipsum.com</span>
        </div>
      </div>

      <button type="button" class="button button-w-100 bg-color-1 d-flex align-items-center justify-content-center gap-2 m-t-1" style="color:var(--white); text-decoration:none;">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="icon-xs icon-white-fill"><path d="M11 3h4a2 2 0 0 1 2 2v3h-2V5h-4v14h4v-3h2v3a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm2 8h9m0 0-3.5-3.5M22 11l-3.5 3.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Continue to Single Sign-On</span>
      </button>

      <div class="centered-row gap-2 m-t-3 m-b-3">
        <hr class="width-50" style="flex:1;">
        <span class="small grey">or</span>
        <hr class="width-50" style="flex:1;">
      </div>

      <form>
        <div class="form-group">
          <label class="small grey m-b--1-4" style="display:block;">Work email</label>
          <input type="email" class="form-control" placeholder="you@company.com">
        </div>
        <div class="form-group">
          <label class="small grey m-b--1-4" style="display:block;">Password</label>
          <input type="password" class="form-control" placeholder="Enter your password">
        </div>
        <button type="submit" class="button button-w-100 m-t-1">
          Sign in with password
        </button>
      </form>

      <div class="msg bg-surface-raised m-t-3">
        <div class="d-flex align-items-start gap-2">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="icon-s icon-info-fill"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 8h-3a15 15 0 0 0-1.2-5.4A8 8 0 0 1 18.9 10zM12 4.1c.8 1.1 1.6 3 1.9 5.9h-3.8c.3-2.9 1.1-4.8 1.9-5.9zM4 12a8 8 0 0 1 .1-1h3a17 17 0 0 0 0 2h-3A8 8 0 0 1 4 12zm1.1 2h3a15 15 0 0 0 1.2 5.4A8 8 0 0 1 5.1 14zM8.3 11a15 15 0 0 1 0-2h7.4a15 15 0 0 1 0 2H8.3zm1.8 3h3.8c-.3 2.9-1.1 4.8-1.9 5.9-.8-1.1-1.6-3-1.9-5.9zm5.9 5.4A15 15 0 0 0 17.2 14h3a8 8 0 0 1-4.2 5.4zM17.2 11a17 17 0 0 0 0-2h3a8 8 0 0 1 0 2h-3z"/></svg>
          <span class="small grey">Your organization uses SAML SSO. Contact your IT administrator if you're having trouble signing in.</span>
        </div>
      </div>
    </div>

    <p class="center small grey m-t-3">
      Not part of an organization? <a href="#" class="color-1" style="font-weight:600;">Sign up individually</a>
    </p>

  </div>

</div>
</body>
</html>
