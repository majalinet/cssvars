<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Your Account — Lorem Ipsum</title>
<link rel="stylesheet" href="https://cdn.cssvars.com/cssvars.css">
</head>
<body class="bg-light-grey">
<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height:100vh; padding-top:3rem; padding-bottom:3rem;">

  <div class="center m-b-3">
    <span class="h4" style="font-weight:600;">Lorem Ipsum</span>
  </div>

  <div style="max-width:26rem; width:100%;">
    <div class="tabs tabs-boxed">

      <input type="radio" name="authTabs" id="tabLogin" checked>
      <label for="tabLogin">Sign In</label>
      <div class="tab">
        <form>
          <div class="form-group">
            <label class="small grey m-b--1-4" style="display:block;">Email</label>
            <input type="email" class="form-control" placeholder="you@loremipsum.com">
          </div>
          <div class="form-group">
            <label class="small grey m-b--1-4" style="display:block;">Password</label>
            <input type="password" class="form-control" placeholder="Enter your password">
          </div>
          <div class="d-flex justify-content-between align-items-center m-b-3">
            <div class="d-flex align-items-center gap-2">
              <input type="checkbox" class="styled-checkbox" id="rememberTab">
              <label for="rememberTab" class="small grey">Remember me</label>
            </div>
            <a href="#" class="small color-1">Forgot password?</a>
          </div>
          <button type="submit" class="button button-w-100 bg-color-1" style="color:var(--white);">Sign in</button>
        </form>

        <div class="centered-row gap-2 m-t-3 m-b-3">
          <hr class="width-50" style="flex:1;">
          <span class="small grey">or</span>
          <hr class="width-50" style="flex:1;">
        </div>
        <a href="#" class="button button-w-100 d-flex align-items-center justify-content-center gap-2" style="text-decoration:none;">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="icon-xs">
<path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/>
<path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.3 21.3 7.3 24 12 24z"/>
<path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.6.4-2.4V6.5H1.4A12 12 0 0 0 0 12c0 1.9.5 3.8 1.4 5.5z"/>
<path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4C17.9 1.2 15.1 0 12 0 7.3 0 3.3 2.7 1.4 6.5l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/>
</svg><span>Continue with Google</span>
        </a>
      </div>

      <input type="radio" name="authTabs" id="tabSignup">
      <label for="tabSignup">Create Account</label>
      <div class="tab">
        <form>
          <div class="form-group">
            <label class="small grey m-b--1-4" style="display:block;">Full name</label>
            <input type="text" class="form-control" placeholder="Loremus Ipsumar">
          </div>
          <div class="form-group">
            <label class="small grey m-b--1-4" style="display:block;">Email</label>
            <input type="email" class="form-control" placeholder="you@loremipsum.com">
          </div>
          <div class="form-group">
            <label class="small grey m-b--1-4" style="display:block;">Password</label>
            <input type="password" class="form-control" placeholder="Create a password">
          </div>
          <div class="d-flex align-items-center gap-2 m-b-3">
            <input type="checkbox" class="styled-checkbox" id="termsTab">
            <label for="termsTab" class="small grey">I agree to the Terms &amp; Privacy Policy</label>
          </div>
          <button type="submit" class="button button-w-100 bg-color-1" style="color:var(--white);">Create account</button>
        </form>
      </div>

    </div>
  </div>

</div>
</body>
</html>
