<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Vars Framework — New Component Showcase</title>
<!-- Local build during development. Once merged, swap for: -->
<!-- <link rel="stylesheet" href="https://cdn.cssvars.com/cssvars.css"> -->
<link rel="stylesheet" href="../css/cssvars.css">
</head>
<body>

<div class="container p2">

  
  




  <!-- ============================================================
       FILES TREE
       ============================================================ -->
  <section class="m-b-4">
    <h2>Files tree</h2>
    <div class="panel">
      <ul class="file-tree">
        <li>
          <input type="checkbox" id="ft-src" class="file-tree-toggle" checked>
          <label class="file-tree-folder" for="ft-src">
            <svg class="file-tree-chevron icon-dark-fill" viewBox="0 0 24 24"><path d="M8.59,16.59L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.59Z"/></svg>
            <svg class="icon-xxs icon-color-1-fill" viewBox="0 0 24 24"><path d="M10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6H12L10,4Z"/></svg>
            src
          </label>
          <ul class="file-tree-children">
            <li>
              <input type="checkbox" id="ft-components" class="file-tree-toggle">
              <label class="file-tree-folder" for="ft-components">
                <svg class="file-tree-chevron icon-dark-fill" viewBox="0 0 24 24"><path d="M8.59,16.59L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.59Z"/></svg>
                <svg class="icon-xxs icon-color-1-fill" viewBox="0 0 24 24"><path d="M10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6H12L10,4Z"/></svg>
                components
              </label>
              <ul class="file-tree-children">
                <li>
                  <span class="file-tree-file">
                    <svg class="icon-xxs icon-grey-fill" viewBox="0 0 24 24"><path d="M13,9H18.5L13,3.5V9M6,2H14L20,8V20A2,2 0 0,1 18,22H6C4.89,22 4,21.1 4,20V4C4,2.89 4.89,2 6,2Z"/></svg>
                    Drawer.jsx
                  </span>
                </li>
              </ul>
            </li>
            <li>
              <span class="file-tree-file">
                <svg class="icon-xxs icon-grey-fill" viewBox="0 0 24 24"><path d="M13,9H18.5L13,3.5V9M6,2H14L20,8V20A2,2 0 0,1 18,22H6C4.89,22 4,21.1 4,20V4C4,2.89 4.89,2 6,2Z"/></svg>
                cssvars.css
              </span>
            </li>
          </ul>
        </li>
        <li>
          <span class="file-tree-file">
            <svg class="icon-xxs icon-grey-fill" viewBox="0 0 24 24"><path d="M13,9H18.5L13,3.5V9M6,2H14L20,8V20A2,2 0 0,1 18,22H6C4.89,22 4,21.1 4,20V4C4,2.89 4.89,2 6,2Z"/></svg>
            README.md
          </span>
        </li>
      </ul>
    </div>
  </section>


</div>

</body>
</html>
