<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Vars Framework — New Component Showcase</title>
<!-- Local build during development. Once merged, swap for: -->
<!-- <link rel="stylesheet" href="https://cdn.cssvars.com/cssvars.css"> -->
<link rel="stylesheet" href="../css/cssvars.css">
</head>
<body>

<div class="container p2">




  <!-- ============================================================
       STEPPER
       ============================================================ -->
  <section class="m-b-4">
    <h2>Stepper</h2>
    <ul class="stepper">
      <li class="stepper-step is-complete">
        <span class="stepper-circle">
          <svg class="icon-xxs icon-white-fill" viewBox="0 0 24 24"><path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"/></svg>
        </span>
        <span class="stepper-label">Cart</span>
      </li>
      <li class="stepper-step is-active">
        <span class="stepper-circle">2</span>
        <span class="stepper-label">Shipping</span>
      </li>
      <li class="stepper-step">
        <span class="stepper-circle">3</span>
        <span class="stepper-label">Payment</span>
      </li>
      <li class="stepper-step">
        <span class="stepper-circle">4</span>
        <span class="stepper-label">Confirm</span>
      </li>
    </ul>
  </section>

</div>

</body>
</html>
